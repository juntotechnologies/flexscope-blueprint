<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{url}}og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>{{css}}</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Flexscope home">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 25V12a6 6 0 0 1 12 0v4a4 4 0 0 0 8 0V7"/><circle cx="27" cy="6" r="2"/></svg></span>
    <span class="word">{{word1}}<br>{{word2}}</span>
  </a>
  <nav class="top-actions">
    <a class="btn" href="{{repo}}" rel="noopener" target="_blank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5a3 3 0 0 0-1-2.5c3 0 6-2 6-5.5a4.5 4.5 0 0 0-1-3 4 4 0 0 0 0-3s-1-.3-3.5 1.3a12 12 0 0 0-6 0C6.5 2.8 5.5 3 5.5 3a4 4 0 0 0 0 3 4.5 4.5 0 0 0-1 3c0 3.5 3 5.5 6 5.5a3 3 0 0 0-1 2.5V22"/></svg><span class="btn-text">{{repoLabel}}</span></a>
    <button class="btn icon" type="button" id="theme" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </nav>
</header>

<main>
  <section class="stage" aria-label="Teardown drawing">
    <span class="chip">{{chip}}</span>
    <div class="sheets">{{sheets}}</div>
    <div class="dwgs">{{dwg}}<p class="sub">NTS · Concept drawing</p></div>
    <div class="controls">
      {{drawingSwitch}}
      {{viewSwitch}}
    </div>
    <a class="cta" href="viewer/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z M3 7l9 5 9-5 M12 12v10"/></svg>{{viewerLabel}}</a>
  </section>

  <section class="card intro">{{intro}}</section>
  {{sections}}
</main>

<footer class="foot">
  <a href="{{orgUrl}}">{{orgName}}</a>
  <span>Concept only · not a medical device</span>
</footer>
<script>{{js}}</script>
</body>
</html>
